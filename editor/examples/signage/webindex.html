.scroller-main {
  text-align: center;
  height: 110vh;
  display: flex;
  flex-direction: column;
  justify-content: space-around;
}
.title {
 font-size: 42px;
}
.image {
  height: 99px;
  width: 176px;
  font-size: 25px;
  /*background: blue;*/
  margin: 10px;
  display: inline-block;
  line-height: 100px; 
  color: #ffffff;
}
.image-container {
  vertical-align: middle;
  display: inline-block;
  white-space: nowrap;
  overflow-x: auto;
  overflow-y: hidden;
  width: 80%;
}
.prev, .next {
  padding-top: 10px;
  padding-bottom: 10px;
  height: 100%;
  width: 100px;
  cursor: pointer;
  color: black;
  transition: 0.6s ease;
}
.next {
  margin-left: 5px;
}
.prev {
  margin-right: 5px;
}
.prev:hover, .next:hover {
  color: white;
  height: 100%;
  background-color: rgba(0,0,0,0.8);
}
